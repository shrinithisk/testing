name: Build & Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Missing explicit least-privilege permissions block (Actionlint security flaw)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2  # Actionlint: unpinned mutable tag

      - name: Set up Python
        uses: actions/setup-python@v2  # Actionlint: unpinned mutable tag
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Application Tests
        run: |
          python -c "import app; print('App module loaded successfully')"
